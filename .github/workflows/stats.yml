name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: lazzy-amrit
          exclude_repos: ""
          exclude_langs: ""
          hide_border: true
          github_token: ${{ secrets.ACCESS_TOKEN }}
